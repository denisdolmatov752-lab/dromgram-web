server {
    listen 80;
    server_name orproject.ru www.orproject.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name orproject.ru www.orproject.ru;

    ssl_certificate /root/.acme.sh/orproject.ru/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/orproject.ru/orproject.ru.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 50M;
    
    # Оптимизация для раздачи больших файлов
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    
    # Сжатие только для текста
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
    gzip_disable "msie6";

    # Backend API
    location /api/ {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }

    # WebSocket
    location /socket.io/ {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Media files
    location /media/ {
        alias /var/dromgram/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # APK downloads - специальная оптимизация для больших файлов
    location /dromgram.apk {
        alias /root/dromgram.apk;
        gzip off;  # Отключить сжатие для бинарных файлов
        types { 
            application/vnd.android.package-archive apk;
        }
        add_header Content-Disposition "attachment; filename=dromgram.apk" always;
        add_header Content-Type "application/vnd.android.package-archive" always;
        add_header Accept-Ranges "bytes" always;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        expires 7d;
    }

    # Admin panel
    location /admin/ {
        alias /root/TG-Project/dromgram-admin/dist/;
        try_files $uri $uri/ /admin/index.html;
        expires 1d;
    }

    # Web app (default)
    location / {
        root /root/TG-Project/dromgram-web/dist;
        try_files $uri $uri/ /index.html;
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }
}
